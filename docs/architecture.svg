<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,monospace">
  <title>feed-my-accounting: sources, modules and where their documents go</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4b5568"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d6333a"/>
    </marker>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect x="6" y="6" width="2" height="2" fill="#e4e0d6"/>
    </pattern>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1f2a44" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Paper card, as the web interface has it. -->
  <rect x="0" y="0" width="1200" height="820" rx="18" fill="#faf9f6"/>
  <rect x="0" y="0" width="1200" height="820" rx="18" fill="url(#dots)"/>
  <rect x="0.5" y="0.5" width="1199" height="819" rx="18" fill="none" stroke="#dcd7cc"/>

  <text x="40" y="48" font-size="13" letter-spacing="4" fill="#6b7280" font-weight="700">HOW IT FITS TOGETHER</text>

  <!-- How a run starts. -->
  <g font-size="13" fill="#1f2a44" text-anchor="middle">
    <rect x="370" y="30" width="140" height="34" rx="17" fill="#fff" stroke="#1f2a44" filter="url(#lift)"/>
    <text x="440" y="52">Web interface</text>
    <rect x="530" y="30" width="140" height="34" rx="17" fill="#fff" stroke="#1f2a44" filter="url(#lift)"/>
    <text x="600" y="52">Zeitplan · cron</text>
    <rect x="690" y="30" width="140" height="34" rx="17" fill="#fff" stroke="#1f2a44" filter="url(#lift)"/>
    <text x="760" y="52">command line</text>
  </g>
  <g stroke="#1f2a44" stroke-width="1.5" fill="none">
    <path d="M440 64 V80 Q440 88 448 88 H592 Q600 88 600 96 V104"/>
    <path d="M760 64 V80 Q760 88 752 88 H608 Q600 88 600 96"/>
    <path d="M600 64 V104"/>
  </g>

  <!-- The hub: one binary, one config. -->
  <rect x="330" y="104" width="540" height="46" rx="8" fill="#1f2a44" filter="url(#lift)"/>
  <text x="600" y="133" font-size="16" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="1">feed-my-accounting<tspan fill="#9fb0d0" font-weight="400"> · one config.yaml · Go</tspan></text>
  <path d="M600 150 V182" stroke="#1f2a44" stroke-width="1.5"/>

  <!-- Column heads. -->
  <g font-size="11" letter-spacing="3" fill="#6b7280" font-weight="700">
    <text x="40" y="212">SOURCES</text>
    <text x="430" y="212">MODULES</text>
    <text x="930" y="212">DESTINATIONS</text>
  </g>

  <!-- Sources. -->
  <g font-size="12" fill="#4b5568">
    <rect x="40" y="258" width="250" height="76" rx="8" fill="#fff" stroke="#cfc9bc" filter="url(#lift)"/>
    <text x="58" y="284" font-size="15" font-weight="700" fill="#1f2a44">Mailboxes · IMAP</text>
    <text x="58" y="304">inbox, then Rechnungen</text>
    <text x="58" y="322">several accounts, rules</text>
    <rect x="40" y="410" width="250" height="76" rx="8" fill="#fff" stroke="#cfc9bc" filter="url(#lift)"/>
    <text x="58" y="436" font-size="15" font-weight="700" fill="#1f2a44">Portals</text>
    <text x="58" y="456">Amazon Business, MeinVodafone</text>
    <text x="58" y="474">headless Chrome, a login gate</text>
    <rect x="40" y="514" width="250" height="76" rx="8" fill="#fff" stroke="#cfc9bc" filter="url(#lift)"/>
    <text x="58" y="540" font-size="15" font-weight="700" fill="#1f2a44">Harvest API</text>
    <text x="58" y="560">time entries, budgets</text>
    <text x="58" y="578">personal access token</text>
    <rect x="40" y="604" width="250" height="76" rx="8" fill="#fff" stroke="#cfc9bc" filter="url(#lift)"/>
    <text x="58" y="630" font-size="15" font-weight="700" fill="#1f2a44">Calendar · config</text>
    <text x="58" y="650">clients, vacation,</text>
    <text x="58" y="668">assignments, holidays</text>
  </g>

  <!-- Modules, each in its vendor's colour. -->
  <rect x="412" y="182" width="376" height="510" rx="12" fill="none" stroke="#1f2a44" stroke-dasharray="4 5" opacity="0.45"/>
  <g font-size="12" fill="#4b5568">
    <g filter="url(#lift)">
      <rect x="430" y="226" width="340" height="64" rx="8" fill="#fff" stroke="#cfc9bc"/>
      <rect x="430" y="226" width="8" height="64" rx="3" fill="#6b7280"/>
    </g>
    <text x="454" y="252" font-size="15" font-weight="700" fill="#1f2a44">mail-receipts</text>
    <text x="454" y="274">PDFs by rule: Anthropic, Strato, …</text>
    <g filter="url(#lift)">
      <rect x="430" y="302" width="340" height="64" rx="8" fill="#fff" stroke="#cfc9bc"/>
      <rect x="430" y="302" width="8" height="64" rx="3" fill="#1d1d1f"/>
    </g>
    <text x="454" y="328" font-size="15" font-weight="700" fill="#1f2a44">apple-invoice</text>
    <text x="454" y="350">HTML invoice → PDF, by order no.</text>
    <g filter="url(#lift)">
      <rect x="430" y="378" width="340" height="64" rx="8" fill="#fff" stroke="#cfc9bc"/>
      <rect x="430" y="378" width="8" height="64" rx="3" fill="#ff9900"/>
    </g>
    <text x="454" y="404" font-size="15" font-weight="700" fill="#1f2a44">amazon-invoice</text>
    <text x="454" y="426">the month's orders' invoices</text>
    <g filter="url(#lift)">
      <rect x="430" y="454" width="340" height="64" rx="8" fill="#fff" stroke="#cfc9bc"/>
      <rect x="430" y="454" width="8" height="64" rx="3" fill="#e60000"/>
    </g>
    <text x="454" y="480" font-size="15" font-weight="700" fill="#1f2a44">vodafone-invoice</text>
    <text x="454" y="502">the current invoices as PDF</text>
    <g filter="url(#lift)">
      <rect x="430" y="530" width="340" height="64" rx="8" fill="#fff" stroke="#cfc9bc"/>
      <rect x="430" y="530" width="8" height="64" rx="3" fill="#fa5d00"/>
    </g>
    <text x="454" y="556" font-size="15" font-weight="700" fill="#1f2a44">harvest-invoice</text>
    <text x="454" y="578">hours → draft + Zeitnachweis</text>
    <g filter="url(#lift)">
      <rect x="430" y="606" width="340" height="64" rx="8" fill="#fff" stroke="#cfc9bc"/>
      <rect x="430" y="606" width="8" height="64" rx="3" fill="#6fa8dc"/>
    </g>
    <text x="454" y="632" font-size="15" font-weight="700" fill="#1f2a44">travel-expense</text>
    <text x="454" y="654">Kilometer · Verpflegung · Übernachtung</text>
  </g>

  <!-- Sources to modules. -->
  <g stroke="#4b5568" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <path d="M290 288 C360 288 360 258 428 258"/>
    <path d="M290 304 C360 304 360 334 428 334"/>
    <path d="M290 440 C360 440 360 410 428 410"/>
    <path d="M290 456 C360 456 360 486 428 486"/>
    <path d="M290 552 C360 552 360 562 428 562"/>
    <path d="M290 642 C360 642 360 638 428 638"/>
  </g>

  <!-- Destinations. -->
  <g font-size="12" fill="#4b5568">
    <rect x="930" y="226" width="230" height="128" rx="8" fill="#fff" stroke="#d6333a" stroke-width="1.5" filter="url(#lift)"/>
    <text x="948" y="256" font-size="15" font-weight="700" fill="#1f2a44">sevDesk Autobox</text>
    <text x="948" y="280">autobox@sevdesk.email</text>
    <text x="948" y="300">PDFs imported</text>
    <text x="948" y="318">as receipts</text>
    <text x="948" y="340" fill="#d6333a" font-weight="700">by email · SMTP</text>

    <rect x="930" y="376" width="230" height="122" rx="8" fill="#fff" stroke="#1f2a44" stroke-width="1.2" filter="url(#lift)"/>
    <text x="948" y="404" font-size="15" font-weight="700" fill="#1f2a44">Ledger · Abschluss</text>
    <text x="948" y="426">each receipt once, none</text>
    <text x="948" y="444">filed by hand twice;</text>
    <text x="948" y="462">the month at a glance</text>
    <text x="948" y="482" fill="#1f2a44" font-weight="700">Pushover · tax adviser</text>

    <rect x="930" y="514" width="230" height="104" rx="8" fill="#fff" stroke="#d6333a" stroke-width="1.5" filter="url(#lift)"/>
    <text x="948" y="544" font-size="15" font-weight="700" fill="#1f2a44">sevDesk draft</text>
    <text x="948" y="568">E-Rechnung, the hours</text>
    <text x="948" y="586">the budget allows</text>
    <text x="948" y="606" fill="#d6333a" font-weight="700">headless Chrome</text>

    <rect x="930" y="636" width="230" height="70" rx="8" fill="#fff" stroke="#cfc9bc" stroke-dasharray="5 4" filter="url(#lift)"/>
    <text x="948" y="664" font-size="15" font-weight="700" fill="#1f2a44">Protokoll</text>
    <text x="948" y="686">every run's PDFs and log</text>
  </g>

  <!-- Modules to destinations. -->
  <g stroke="#d6333a" stroke-width="1.6" fill="none" marker-end="url(#arrow-red)">
    <path d="M770 258 C850 258 850 266 928 266"/>
    <path d="M770 334 C850 334 850 282 928 282"/>
    <path d="M770 410 C850 410 850 298 928 298"/>
    <path d="M770 486 C850 486 850 314 928 314"/>
    <path d="M770 638 C880 638 840 330 928 330"/>
    <path d="M770 562 C850 562 850 566 928 566"/>
  </g>
  <g stroke="#9aa3b2" stroke-width="1.4" fill="none" stroke-dasharray="4 4" marker-end="url(#arrow)">
    <path d="M788 436 H928"/>
    <path d="M788 672 H928"/>
  </g>

  <!-- Where it runs. -->
  <g font-size="12" fill="#6b7280">
    <rect x="40" y="740" width="1120" height="42" rx="8" fill="#fff" stroke="#e4e0d6"/>
    <text x="60" y="766">▣ Raspberry Pi · systemd  ·  Caddy in front, HTTPS  ·  login per employee, at home without password  ·  one job at a time</text>
  </g>
</svg>
